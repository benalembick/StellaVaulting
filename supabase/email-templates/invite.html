<div style="background-color:#F0EBE6; padding:32px 16px; font-family:Georgia, 'Cormorant Garamond', serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background-color:#FFFFFF; border-radius:8px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.06);">
    <tr>
      <td style="background-color:#1F1D1D; padding:28px 0; text-align:center;">
        <img src="https://stellavaulting.com.au/email-logo.png" alt="Stella Vaulting Academy" width="140" style="display:block; margin:0 auto;" />
      </td>
    </tr>
    <tr>
      <td style="padding:36px 32px 8px; text-align:center;">
        <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:14px; letter-spacing:0.15em; text-transform:uppercase; color:#B08D3C; margin:0 0 12px;">Admin Portal</p>
        <h1 style="font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; color:#1F1D1D; margin:0 0 16px;">You've been invited</h1>
        <p style="font-family:Arial, sans-serif; font-size:15px; line-height:1.6; color:#6E6E6E; margin:0 0 28px;">
          You've been invited to join the Stella Vaulting Academy admin team. Click below to set your password and access the admin portal.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 36px; text-align:center;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block; background-color:#B08D3C; color:#FFFFFF; font-family:Arial, sans-serif; font-size:15px; font-weight:bold; text-decoration:none; padding:14px 36px; border-radius:6px;">
          Accept Invitation
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px; text-align:center;">
        <p style="font-family:Arial, sans-serif; font-size:12px; color:#A9A9A9; margin:0;">
          If you weren't expecting this invitation, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="background-color:#FBF9F7; padding:18px; text-align:center; border-top:1px solid #F0EBE6;">
        <p style="font-family:Arial, sans-serif; font-size:11px; color:#A9A9A9; margin:0;">
          &copy; Stella Vaulting Academy
        </p>
      </td>
    </tr>
  </table>
</div>
